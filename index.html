<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- GANTI: nama satuan kerja Anda -->
  <title>Portal Layanan Publik — Lapas Kelas IIB Nabire</title>
  <meta name="description" content="Portal resmi layanan publik pemasyarakatan: prosedur layanan, jadwal kunjungan, dokumen publik, berita, pengaduan, dan survei kepuasan masyarakat.">
  <meta name="theme-color" content="#0b2240">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <style>
    html, body { margin: 0; height: 100%; background: #0b2240; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .muat { position: fixed; inset: 0; display: grid; place-items: center; color: #d4af37; font: 600 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="muat" aria-hidden="true">Memuat portal…</div>
  <iframe id="app" title="Portal Layanan Publik" allow="clipboard-write; fullscreen; geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    // GANTI: URL Web App Apps Script Anda (berakhiran /exec)
    var EXEC = 'https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT/exec';
    // Teruskan parameter tautan langsung (?lihat=berita:judul, ?lihat=lacak:ADU-…) ke aplikasi
    document.getElementById('app').src = EXEC + (location.search || '');
  </script>
  <noscript>Aktifkan JavaScript untuk membuka portal, atau buka langsung: tautan Web App satuan kerja.</noscript>
</body>
</html>
